<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Boletos para Tómbola - EPJ</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #print-area, #print-area * {
                visibility: visible;
            }
            #print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .page-break {
                page-break-after: always;
                break-after: page;
            }
            @page {
                size: letter portrait;
                margin: 10mm;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Controles (Oculto al imprimir) con Logo de EPJ -->
    <header class="bg-indigo-900 text-white shadow-md p-6 print:hidden">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-4">
                <img src="https://scontent.fgdl1-4.fna.fbcdn.net/v/t39.30808-6/491763847_4061400577435674_1474373559711416770_n.jpg?stp=dst-jpg_tt6&cstp=mx960x958&ctp=s960x958&_nc_cat=108&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=a5f93a&_nc_ohc=-v48KM8O3dcQ7kNvwGCanaq&_nc_oc=Adrk6NWBNEFpPrxM4QAhYAulRZHXy7OnRep2P4d8V8QIU15_yuCsb1VdOC2A5awFWIymZkJMfRo6rKz99CdfPpci&_nc_zt=23&_nc_ht=scontent.fgdl1-4.fna&_nc_gid=zkImGISBuvdj3UXj5LuVhQ&_nc_ss=7b2a8&oh=00_AQQygfpcfw7sg396odpivbeJjd6lGQ2yqlEPZocMbTVYFQ&oe=6AF3E968" class="w-14 h-14 object-cover rounded-full border-2 border-amber-400 shadow-md" alt="Logo EPJ">
                <div>
                    <h1 class="text-2xl font-bold flex items-center gap-2">🎟️ Generador de Boletos para Tómbola</h1>
                    <p class="text-indigo-200 text-sm mt-1">Parroquia Santa Faustina Kowalska — EPJ Zapopan</p>
                </div>
            </div>
            <button onclick="window.print()" class="bg-amber-500 hover:bg-amber-600 text-indigo-950 font-bold px-6 py-3 rounded-xl shadow-lg transition-all flex items-center gap-2 cursor-pointer">
                🖨️ Imprimir Boletos
            </button>
        </div>
    </header>

    <!-- Panel de Configuración -->
    <section class="max-w-6xl mx-auto px-6 py-6 w-full print:hidden">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 grid grid-cols-1 md:grid-cols-4 gap-6">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Cantidad Total de Boletos</label>
                <input type="number" id="total-tickets" value="50" min="1" max="1000" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Número Inicial (Folio)</label>
                <input type="number" id="start-number" value="1" min="1" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Número de Encuentro</label>
                <input type="number" id="encounter-number" value="16" min="1" class="w-full px-4 py-2 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:outline-none">
            </div>
            <div class="flex items-end">
                <button onclick="generateTickets()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-xl transition-all cursor-pointer">
                    Actualizar Vista Previa
                </button>
            </div>
        </div>
    </section>

    <!-- Área Principal / Vista Previa -->
    <main class="flex-grow max-w-6xl mx-auto px-6 pb-12 w-full">
        <div class="mb-4 flex justify-between items-center print:hidden">
            <h2 class="text-lg font-semibold text-slate-700">Vista Previa de Páginas (Carta)</h2>
            <span id="stats-info" class="text-sm text-slate-500"></span>
        </div>

        <div id="print-area" class="flex flex-col items-center gap-8">
            <!-- Las páginas de boletos se generan dinámicamente aquí -->
        </div>
    </main>

    <!-- Pie de página -->
    <footer class="bg-slate-200 text-slate-600 text-center py-4 text-xs print:hidden">
        Medida exacta por boleto: 5 cm de largo × 2 cm de alto (Diseño optimizado para impresión en hoja tamaño Carta).
    </footer>

    <script>
        const epjLogoUrl = "https://scontent.fgdl1-4.fna.fbcdn.net/v/t39.30808-6/491763847_4061400577435674_1474373559711416770_n.jpg?stp=dst-jpg_tt6&cstp=mx960x958&ctp=s960x958&_nc_cat=108&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=a5f93a&_nc_ohc=-v48KM8O3dcQ7kNvwGCanaq&_nc_oc=Adrk6NWBNEFpPrxM4QAhYAulRZHXy7OnRep2P4d8V8QIU15_yuCsb1VdOC2A5awFWIymZkJMfRo6rKz99CdfPpci&_nc_zt=23&_nc_ht=scontent.fgdl1-4.fna&_nc_gid=zkImGISBuvdj3UXj5LuVhQ&_nc_ss=7b2a8&oh=00_AQQygfpcfw7sg396odpivbeJjd6lGQ2yqlEPZocMbTVYFQ&oe=6AF3E968";

        function generateTickets() {
            const total = parseInt(document.getElementById('total-tickets').value) || 50;
            const startNum = parseInt(document.getElementById('start-number').value) || 1;
            const encounterNum = document.getElementById('encounter-number').value || "16";
            const container = document.getElementById('print-area');
            container.innerHTML = '';

            const ticketsPerPage = 36;
            const totalPages = Math.ceil(total / ticketsPerPage);

            document.getElementById('stats-info').innerText = `Se generarán ${total} boletos en ${totalPages} hoja(s) carta.`;

            let currentTicketIndex = 0;

            for (let p = 0; p < totalPages; p++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = "bg-white shadow-md border border-slate-300 p-4 box-border flex flex-col justify-between page-break";
                pageDiv.style.width = "210mm";
                pageDiv.style.height = "279mm";
                pageDiv.style.position = "relative";

                const gridDiv = document.createElement('div');
                gridDiv.style.display = "grid";
                gridDiv.style.gridTemplateColumns = "repeat(3, 50mm)";
                gridDiv.style.gridTemplateRows = "repeat(12, 20mm)";
                gridDiv.style.gap = "1mm 2mm";
                gridDiv.style.justifyContent = "center";
                gridDiv.style.alignContent = "center";
                gridDiv.style.height = "100%";

                for (let i = 0; i < ticketsPerPage; i++) {
                    if (currentTicketIndex >= total) {
                        const emptyCell = document.createElement('div');
                        gridDiv.appendChild(emptyCell);
                        continue;
                    }

                    const folioNum = startNum + currentTicketIndex;
                    const formattedFolio = String(folioNum).padStart(5, '0');

                    const ticket = document.createElement('div');
                    ticket.className = "relative bg-white border-2 border-indigo-900 rounded-[2px] box-border flex overflow-hidden";
                    ticket.style.width = "50mm";
                    ticket.style.height = "20mm";
                    ticket.style.fontSize = "5.5pt";

                    ticket.innerHTML = `
                        <!-- MATRIZ / PARTE IZQUIERDA -->
                        <div class="flex-grow p-1 flex flex-col justify-between relative bg-indigo-50/20" style="width: 32mm;">
                            <!-- Esquina Sup. Izquierda: Logo EPJ más grande + Encuentro dinámico -->
                            <div class="flex items-center gap-1">
                                <img src="${epjLogoUrl}" class="w-12 h-12 object-cover rounded-full border border-indigo-900" alt="EPJ">
                                <span class="font-bold text-[5pt] text-indigo-950 tracking-tighter">ENCUENTRO #${encounterNum}</span>
                            </div>

                            <!-- Inferior izquierdo: Parroquia Santa Faustina Kowalska -->
                            <div class="text-[3.8pt] font-extrabold text-indigo-950 uppercase leading-tight truncate">
                                PARROQUIA SANTA FAUSTINA KOWALSKA
                            </div>
                        </div>

                        <!-- LÍNEA DE CORTE / PERFORACIÓN -->
                        <div class="border-r border-dashed border-indigo-400 my-0.5"></div>

                        <!-- COPIA / MATRIZ DE CONTROL DERECHA -->
                        <div class="flex flex-col justify-between p-1 bg-indigo-900/5" style="width: 18mm;">
                            <div class="flex justify-between items-start">
                                <span class="font-extrabold text-[5.5pt] text-indigo-950 tracking-tighter">TÓMBOLA</span>
                            </div>
                            <div class="text-center my-auto">
                                <div class="text-[3.5pt] text-indigo-950 font-semibold">Folio</div>
                                <div class="font-mono font-bold text-[6pt] text-indigo-950">${formattedFolio}</div>
                            </div>
                        </div>
                    `;

                    gridDiv.appendChild(ticket);
                    currentTicketIndex++;
                }

                pageDiv.appendChild(gridDiv);
                container.appendChild(pageDiv);
            }
        }

        window.onload = generateTickets;
    </script>
</body>
</html>
